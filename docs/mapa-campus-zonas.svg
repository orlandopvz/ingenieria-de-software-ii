<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="t">
  <title id="t">Mapa simplificado del campus Hermosillo de la Universidad de Sonora en 8 zonas</title>
  <rect width="1000" height="550" fill="#F8FAFC"/>
