    <circle cx="587" cy="281" r="16" fill="#002D62" stroke="#FFFFFF" stroke-width="1.5"/><text x="587" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
